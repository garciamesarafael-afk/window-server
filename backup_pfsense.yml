---
- name: Respaldar la configuración XML de pfSense
  hosts: pfsense
  gather_facts: false

  vars:
    backup_directory: "/tmp/pfsense_backups"

  tasks:
    - name: Crear la carpeta local de respaldos si no existe
      ansible.builtin.file:
        path: "{{ backup_directory }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Descargar el archivo config.xml desde pfSense
      ansible.builtin.fetch:
        src: /conf/config.xml
        dest: "{{ backup_directory }}/pfsense_config_{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M') }}.xml"
        flat: true

    - name: Confirmar el guardado del archivo
      ansible.builtin.debug:
        msg: "Respaldo de pfSense guardado en {{ backup_directory }}/pfsense_config_{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M') }}.xml"
