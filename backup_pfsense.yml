---
- name: Respaldar la configuración XML de pfSense (Solo última copia)
  hosts: pfsense
  gather_facts: false

  vars:
    backup_directory: "/tmp/pfsense_backups"

  tasks:
    - name: Crear la carpeta local de respaldos si no existe
      ansible.builtin.file:
        path: "{{ backup_directory }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Descargar el archivo config.xml (Sobrescribe la copia anterior)
      ansible.builtin.fetch:
        src: /conf/config.xml
        dest: "{{ backup_directory }}/pfsense_config_latest.xml"
        flat: true

    - name: Confirmar el guardado del respaldo
      ansible.builtin.debug:
        msg: "Copia de seguridad guardada y actualizada en {{ backup_directory }}/pfsense_config_latest.xml"
