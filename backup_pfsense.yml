---
- name: Respaldar la configuración XML de pfSense
  hosts: pfsense
  gather_facts: false

  tasks:
    - name: Crear carpeta de respaldos en la cuenta del usuario
      ansible.builtin.file:
        path: "/home/rafa/pfsense_backups"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Descargar el archivo config.xml desde pfSense
      ansible.builtin.fetch:
        src: /conf/config.xml
        dest: "/home/rafa/pfsense_backups/pfsense_config_latest.xml"
        flat: true

    - name: Confirmar el guardado del respaldo
      ansible.builtin.debug:
        msg: "Copia de seguridad guardada con éxito en /home/rafa/pfsense_backups/pfsense_config_latest.xml"
